name: Cutover TV Sumare

on:
  push:
    branches:
      - feature/tvsumare-boletim-social
    paths:
      - .github/workflows/cutover-tvsumare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutover-tvsumare
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      OPS_REPO_DIR: /srv/tvsumare/repository
      TARGET_BRANCH: feature/tvsumare-boletim-social
      COMPOSE_FILE: docker-compose.vps.yml
      DOCKER_PROJECT: tvsumare

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          ref: feature/tvsumare-boletim-social
          fetch-depth: 1
          clean: true

      - name: Preflight and preserve runtime branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPS_REPO_DIR"
          test -z "$(git status --porcelain)"
          PREV_BRANCH="$(git branch --show-current)"
          PREV_HEAD="$(git rev-parse HEAD)"
          test -n "$PREV_BRANCH"
          git fetch --prune origin
          git merge-base --is-ancestor "$PREV_HEAD" "origin/$TARGET_BRANCH"
          git push origin "$PREV_HEAD:refs/heads/$PREV_BRANCH"
          echo "PREV_BRANCH=$PREV_BRANCH" >> "$GITHUB_ENV"
          echo "PREV_HEAD=$PREV_HEAD" >> "$GITHUB_ENV"

      - name: Switch runtime worktree to official branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPS_REPO_DIR"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test -z "$(git status --porcelain)"
          echo "TARGET_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build TV services
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPS_REPO_DIR"
          docker compose -p "$DOCKER_PROJECT" -f "$COMPOSE_FILE" build web radar_scheduler

      - name: Recreate TV services
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPS_REPO_DIR"
          docker compose -p "$DOCKER_PROJECT" -f "$COMPOSE_FILE" up -d --no-build --force-recreate web radar_scheduler

      - name: Validate TV health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            WEB_STATE="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' tvsumare_web 2>/dev/null || true)"
            RADAR_STATE="$(docker inspect -f '{{.State.Status}}' tvsumare_radar_scheduler 2>/dev/null || true)"
            if [ "$WEB_STATE" = "healthy" ] && [ "$RADAR_STATE" = "running" ]; then
              break
            fi
            sleep 5
          done
          test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' tvsumare_web)" = "healthy"
          test "$(docker inspect -f '{{.State.Status}}' tvsumare_radar_scheduler)" = "running"
          HML_CODE="$(curl -ksS -o /tmp/tv-hml.out -w '%{http_code}' https://tv-hml.vitrineiapro.com.br/)"
          PROD_CODE="$(curl -ksS -o /tmp/tv-prod.out -w '%{http_code}' https://tvsumare.com.br/)"
          test "$HML_CODE" = "200"
          test "$PROD_CODE" = "200"

      - name: Roll back on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPS_REPO_DIR"
          git checkout -B "$PREV_BRANCH" "$PREV_HEAD"
          docker compose -p "$DOCKER_PROJECT" -f "$COMPOSE_FILE" build web radar_scheduler
          docker compose -p "$DOCKER_PROJECT" -f "$COMPOSE_FILE" up -d --no-build --force-recreate web radar_scheduler

      - name: Summary
        if: always()
        shell: bash
        run: |
          cd "$OPS_REPO_DIR"
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          echo "target=${TARGET_HEAD:-unknown}"
