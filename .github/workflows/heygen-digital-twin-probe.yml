name: HeyGen Digital Twin Probe Tests
on:
  pull_request:
    paths:
      - 'includes/heygen_digital_twin_probe.php'
      - 'tests/heygen_digital_twin_probe_test.php'
      - '.github/workflows/heygen-digital-twin-probe.yml'
  workflow_dispatch:
jobs:
  probe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint
        run: |
          php -l includes/heygen_digital_twin_probe.php
          php -l tests/heygen_digital_twin_probe_test.php
      - name: Run isolated mock tests (no HeyGen API or credits)
        run: php tests/heygen_digital_twin_probe_test.php
