name: TV Sumare CI

on:
  pull_request:
  push:
    branches:
      - main
      - reconcile/hostgator-tvsumare-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP lint completo
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -print0)
          echo "PHP_LINT=PASS"

      - name: Teste da politica editorial V3
        run: php tests/editorial_policy_v3_test.php

      - name: Validar regras editoriais criticas
        shell: bash
        run: |
          set -euo pipefail
          grep -q "sensitive_review_required" admin/radar-regional.php
          grep -q "image_review_required" admin/radar-regional.php
          grep -q "cron-radar.log" admin/cron_radar.php
          grep -q "tvs_v3_is_regional_news" includes/tvs_editorial_policy_v3.php
          grep -q "mossor" includes/tvs_editorial_policy_v3.php
          echo "EDITORIAL_GUARDS=PASS"

  docker-smoke:
    runs-on: ubuntu-latest
    needs: php-quality
    steps:
      - uses: actions/checkout@v4

      - name: Build + aplicadores + smoke de homologacao
        run: docker build -t tvsumare-ci .
  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: php-quality
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated smoke image
        run: docker build --tag tvsumare:http-smoke .

      - name: Start isolated container
        run: |
          docker run -d --name tvsumare-http-smoke \
            -p 127.0.0.1:18080:80 \
            --tmpfs /var/www/html/data:rw,nosuid,nodev,mode=0755 \
            -e TVSUMARE_ENV=ci \
            tvsumare:http-smoke

      - name: Check public routes and deny unauthenticated callback
        shell: bash
        run: |
          set -euo pipefail
          base="http://127.0.0.1:18080"
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null "$base/health.php"; then
              break
            fi
            sleep 2
          done

          check() {
            local path="$1" expected="$2" actual
            actual=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$base$path")
            echo "$path: HTTP $actual (expected $expected)"
            test "$actual" = "$expected"
          }

          check /health.php 200
          check / 200
          check /admin/login.php 200
          check /rss.php 200
          check /api/heygen-callback.php 403

      - name: Container diagnostics on failure
        if: failure()
        run: docker logs --tail 80 tvsumare-http-smoke

      - name: Stop smoke container
        if: always()
        run: docker rm -f tvsumare-http-smoke || true
