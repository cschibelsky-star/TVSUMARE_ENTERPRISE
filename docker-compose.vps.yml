name: tvsumare

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tvsumare_web
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      # Dedicated HML-only environment file, required and never committed.
      - .env.hml.runtime
    environment:
      TVSUMARE_ENV: homologation
      TVSUMARE_SITE_NAME: TV Sumare
      OPENAI_API_KEY: ''
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_FALLBACK_MODELS: ''
      HEYGEN_API_KEY: ''
      YOUTUBE_CLIENT_ID: ''
      YOUTUBE_CLIENT_SECRET: ''
      YOUTUBE_PRIVACY_STATUS: private
      SITE_FACTORY_TOKEN: ''
      TVSUMARE_OUTBOUND_HOSTS: ''
      TVSUMARE_WHATSAPP_WEBHOOK_URL: ''
    volumes:
      - type: bind
        source: /srv/tvsumare/hml-isolated/data
        target: /var/www/html/data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/tvsumare/hml-isolated/uploads
        target: /var/www/html/uploads
        bind:
          create_host_path: false
      - type: bind
        source: /srv/tvsumare/hml-isolated/videos
        target: /var/www/html/videos
        bind:
          create_host_path: false
      - type: bind
        source: /srv/tvsumare/hml-isolated/logs
        target: /var/www/html/logs
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/apache2:rw,nosuid,nodev,size=8m,mode=0755
      - /var/lock/apache2:rw,nosuid,nodev,size=8m,mode=0755
      - /var/lib/php/sessions:rw,noexec,nosuid,nodev,size=16m,mode=1733,uid=33,gid=33
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tvsumare-hml.rule=Host(`tv-hml.vitrineiapro.com.br`)"
      - "traefik.http.routers.tvsumare-hml.entrypoints=websecure"
      - "traefik.http.routers.tvsumare-hml.tls=true"
      - "traefik.http.routers.tvsumare-hml.tls.certresolver=le"
      - "traefik.http.services.tvsumare-hml.loadbalancer.server.port=80"
      - "traefik.docker.network=n8n-traefik_app_network"
    networks:
      - tvsumare_internal
      - tvsumare_egress
      - vitrine_net
      - n8n-traefik_app_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    stop_grace_period: 20s

  radar_scheduler:
    # Opt-in: never start polling, writing or using provider quotas during HML isolation.
    profiles: [hml-radar-opt-in]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tvsumare_radar_scheduler
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      # Dedicated HML-only environment file, required and never committed.
      - .env.hml.runtime
    command: ["/bin/sh", "-c", "exec su -s /bin/sh www-data -c 'while true; do php /var/www/html/admin/cron_radar.php; sleep 3600; done'"]
    environment:
      TVSUMARE_ENV: homologation
      TVSUMARE_SITE_NAME: TV Sumare
      OPENAI_API_KEY: ''
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_FALLBACK_MODELS: ''
      TVSUMARE_OUTBOUND_HOSTS: ''
      TVSUMARE_WHATSAPP_WEBHOOK_URL: ''
    volumes:
      - type: bind
        source: /srv/tvsumare/hml-isolated/data
        target: /var/www/html/data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/tvsumare/hml-isolated/uploads
        target: /var/www/html/uploads
        bind:
          create_host_path: false
      - type: bind
        source: /srv/tvsumare/hml-isolated/logs
        target: /var/www/html/logs
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      - tvsumare_internal
      - tvsumare_egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5

networks:
  tvsumare_internal:
    name: tvsumare_internal
    internal: true
  tvsumare_egress:
    name: tvsumare_egress
    driver: bridge
    internal: false
  vitrine_net:
    external: true
    name: vitrine_net
  n8n-traefik_app_network:
    external: true
    name: n8n-traefik_app_network
