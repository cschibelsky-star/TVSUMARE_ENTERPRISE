ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
LimitRequestBody 104857600

<Directory "/var/www/html/data">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/logs">
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/uploads">
    AllowOverride None
    Options -Indexes -ExecCGI
    RemoveHandler .php .phtml .phar .cgi .pl .py .sh
    RemoveType .php .phtml .phar .cgi .pl .py .sh
    php_admin_flag engine Off
    <FilesMatch "\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/html/videos">
    AllowOverride None
    Options -Indexes -ExecCGI
    RemoveHandler .php .phtml .phar .cgi .pl .py .sh
    RemoveType .php .phtml .phar .cgi .pl .py .sh
    php_admin_flag engine Off
    <FilesMatch "\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
